# configs/experiments/g4_v2_headline.yaml
# Unified same-GPU headline benchmark on 95 GB G4 (RTX PRO 6000 Blackwell).
#
# Budget: 200 CU (~20 h at 10.0 CU/h), keeping a 20 CU safety reserve above the
# ~9 CU floor where G4 VM creation returns 503 (extras/kaggle-colab-lessons.md).
# Usable budget: 180 CU (~18 h), leaving ~2 h explicitly reserved for the live
# real-time CLI + tunneled Web GUI demo!

name: g4_v2_headline
platform: colab_g4
config: configs/benchmark_v2.yaml
splits_file: data/splits_megascale_id25.parquet
external_file: data/fireprotdb_hf25.parquet
external_files:
  - data/fireprotdb_hf25.parquet
  - data/fireprotdb_holdout.parquet
  - data/s669_holdout.parquet
  - data/s1724_thermomutdb_hf25.parquet
cache: /content/holo/cache/esm2_650M_v2
out_root: /content/holo/runs/g4_v2_headline
num_workers: 4

cost:
  gpu: G4
  cu_per_hour: 10.0       # measured 2026-11-05 (kaggle-colab-lessons.md)
  budget_cu: 200
  reserve_cu: 20          # hard safety floor (>9 CU G4 lockout threshold + demo reserve)

sizing:
  steps_per_epoch: 619    # MEASURED Protein-Batch (P=8 parents x M=64 muts on id25)
  epochs: 20
  sec_per_step: 0.025     # ASSUMED on RTX PRO 6000 Blackwell — replace after first G4 epoch
  eval_overhead: 0.0      # steady epoch rate already includes val/ckpt
  strict_factor: 1.3
  vm_overhead_h: 0.30
  precompute_h: 0.04      # single-pass FP16 EsmForMaskedLM (114 s on T4; faster on G4)
  export_h: 0.01
  external_h: 0.01
  baselines_h: 0.35

cut_order:
  - "competitor_retrain_ddgemb"
  - "*_s46"
  - "*_s45"
  - baselines

items:
  - {id: precompute, kind: precompute}
  - {kind: train, arm: full, seeds: [42, 43, 44, 45, 46], epochs: 20, export: true}
  - {id: baselines, kind: baselines, phase: post, flags: ["--zero-shot-limit", "2000"], est_hours: 0.35}
  # Competitor adapter slots (debugged on Kaggle T4 first, final retrain on G4 here):
  # - {id: competitor_retrain_thermompnn, kind: cmd, phase: post, est_hours: 1.5,
  #    argv: ["{py}", "-m", "scripts.competitors.thermompnn", "--out", "{out}"]}
  # - {id: competitor_retrain_spurs,      kind: cmd, phase: post, est_hours: 2.0,
  #    argv: ["{py}", "-m", "scripts.competitors.spurs", "--out", "{out}"]}
  # - {id: competitor_retrain_rasp,       kind: cmd, phase: post, est_hours: 1.0,
  #    argv: ["{py}", "-m", "scripts.competitors.rasp", "--out", "{out}"]}
  # - {id: competitor_retrain_prostata,   kind: cmd, phase: post, est_hours: 2.0,
  #    argv: ["{py}", "-m", "scripts.competitors.prostata", "--out", "{out}"]}
  # - {id: competitor_retrain_ddgemb,     kind: cmd, phase: post, est_hours: 1.5,
  #    argv: ["{py}", "-m", "scripts.competitors.ddgemb", "--out", "{out}"]}
  - {id: aggregate, kind: aggregate, phase: post}
