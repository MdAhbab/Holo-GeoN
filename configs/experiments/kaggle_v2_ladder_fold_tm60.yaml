# configs/experiments/kaggle_v2_ladder_fold_tm60.yaml
# Split Honesty Ladder — Tier 3 (fold_tm60: TM_min >= 0.60 fold-clustered split,
# united with 30%-id sequence clusters; NOT fold-disjoint at TM_max >= 0.50).
#
# Paired with id30 (kaggle_v2_ladder_id30.yaml) and id25
# (kaggle_v2_ablations.yaml) to produce Figure F3 and Table T2 across 5 seeds.
#
# NOTE: Replace sizing sec_per_step / steps_per_epoch from Wave 0 T4 probe
#       report (wave0_probe_report.json) before launching.

name: kaggle_v2_ladder_fold_tm60
platform: kaggle_t4
config: configs/benchmark_v2.yaml
splits_file: data/splits_megascale_fold_tm60.parquet
external_file: data/fireprotdb_hf25.parquet
external_files:
  - data/fireprotdb_hf25.parquet
  - data/fireprotdb_holdout.parquet
  - data/s669_holdout.parquet
  - data/s1724_thermomutdb_hf25.parquet
cache: /tmp/holo/cache/esm2_650M_v2
out_root: /tmp/holo/runs/kaggle_v2_ladder_fold_tm60
num_workers: 4

cost:
  gpu: T4
  cu_per_hour: 0
  budget_cu: null

sizing:
  steps_per_epoch: 600    # ASSUMED — replace from wave0_probe_report.json
  epochs: 15
  sec_per_step: 0.060     # ASSUMED — replace from wave0_probe_report.json
  eval_overhead: 0.0      # steady epoch-derived rate already includes val/ckpt
  strict_factor: 1.3      # unmeasured until strict run completes
  vm_overhead_h: 0.35
  precompute_h: 0.20
  export_h: 0.02
  external_h: 0.02

items:
  - {id: precompute, kind: precompute}

  - {kind: train, arm: full, seeds: [42, 43, 44, 45, 46], epochs: 15, strict: true, export: true}

  - {kind: train, arm: v1_baseline, seeds: [42, 43, 44, 45, 46], epochs: 12, strict: true, export: true,
     steps_per_epoch: 4782, sec_per_step: 0.117, arm_class: v1_baseline,
     flags: ["--arch", "v1", "--nll-beta", "0.0", "--cds-dropout", "0.0", "--no-protein-batch"]}

  - {kind: train, arm: no_geo_stream, seeds: [42, 43, 44, 45, 46], epochs: 15, strict: true, export: true,
     flags: ["--no-geo-stream"]}

  - {id: aggregate, kind: aggregate, phase: post}
