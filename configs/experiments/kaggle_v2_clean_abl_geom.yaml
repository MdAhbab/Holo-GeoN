# configs/experiments/kaggle_v2_clean_abl_geom.yaml
# Clean Holo-GeoN v2 (L33-default, use_multi_layer: false) unified Ablation +
# 5-Arm Geometry Dissection (A-E) on id25 across 5 paired seeds [42..46].
#
# Wave 1 discovered that un-normalized intermediate ESM-2 layers (18/24/30)
# swamped post-LN layer 33 by -0.044 Pearson (0.6966 vs 0.7405), and Arm E
# failed due to a missing `import os` in src/data.py. This manifest reruns all
# 14 fast v2 arms cleanly on L33 (including `multi_layer_ln` with per-layer LN
# fix and Arm E `true_contact_edges`), while reusing Wave 1's exact 5-seed
# `v1_baseline` (0.7321 +/- 0.0063) so zero GPU hours are wasted.

name: kaggle_v2_clean_abl_geom
platform: kaggle_t4
config: configs/benchmark_v2.yaml
splits_file: data/splits_megascale_id25.parquet
external_file: data/fireprotdb_hf25.parquet
external_files:
  - data/fireprotdb_hf25.parquet
  - data/fireprotdb_holdout.parquet
  - data/s669_holdout.parquet
  - data/s1724_thermomutdb_hf25.parquet
cache: /tmp/holo/cache/esm2_650M_v2
out_root: /tmp/holo/runs/kaggle_v2_clean_abl_geom
num_workers: 4

cost:
  gpu: T4
  cu_per_hour: 0
  budget_cu: null

sizing:
  steps_per_epoch: 619
  epochs: 20
  sec_per_step: 0.067824
  eval_overhead: 0.0
  strict_factor: 1.3
  vm_overhead_h: 0.25
  precompute_h: 0.05
  attach_coords_h: 0.01
  export_h: 0.02
  external_h: 0.01

items:
  - {id: precompute, kind: precompute}
  - {id: attach_coords, kind: attach_coords, geom_npz: data/invariant_backbone_geometry.npz, needs: [precompute]}

  # --- Core clean v2 reference (Arm A) + normalized multi-layer test ---
  - {kind: train, arm: full,                seeds: [42, 43, 44, 45, 46], epochs: 20, strict: true, export: true,
     sec_per_step: 0.067824, arm_class: v2}
  - {kind: train, arm: multi_layer_ln,      seeds: [42, 43, 44, 45, 46], epochs: 20, strict: true, export: true,
     sec_per_step: 0.067824, arm_class: v2, flags: ["--use-multi-layer"]}

  # --- Clean v2 architectural / training ablations ---
  - {kind: train, arm: no_esm_logits_prior, seeds: [42, 43, 44, 45, 46], epochs: 20, strict: true, export: true,
     sec_per_step: 0.067824, arm_class: v2, flags: ["--no-esm-logits-prior"]}
  - {kind: train, arm: no_contact_burial,   seeds: [42, 43, 44, 45, 46], epochs: 20, strict: true, export: true,
     sec_per_step: 0.067824, arm_class: v2, flags: ["--no-contact-burial"]}
  - {kind: train, arm: standard_nll,        seeds: [42, 43, 44, 45, 46], epochs: 20, strict: true, export: true,
     sec_per_step: 0.067824, arm_class: v2, flags: ["--nll-beta", "0.0"]}
  - {kind: train, arm: no_cds_dropout,      seeds: [42, 43, 44, 45, 46], epochs: 20, strict: true, export: true,
     sec_per_step: 0.067824, arm_class: v2, flags: ["--cds-dropout", "0.0"]}
  - {kind: train, arm: no_mech_stream,      seeds: [42, 43, 44, 45, 46], epochs: 20, strict: true, export: true,
     sec_per_step: 0.067824, arm_class: v2, flags: ["--no-mech-stream"]}
  - {kind: train, arm: no_geo_stream,       seeds: [42, 43, 44, 45, 46], epochs: 20, strict: true, export: true,
     sec_per_step: 0.067824, arm_class: v2, flags: ["--no-geo-stream"]}
  - {kind: train, arm: no_ssm,              seeds: [42, 43, 44, 45, 46], epochs: 20, strict: true, export: true,
     sec_per_step: 0.067824, arm_class: v2, flags: ["--no-ssm"]}
  - {kind: train, arm: global_pool_readout, seeds: [42, 43, 44, 45, 46], epochs: 20, strict: true, export: true,
     sec_per_step: 0.067824, arm_class: v2, flags: ["--global-pool-readout"]}

  # --- Controlled 5-Arm Geometry Dissection (Arms B-E; Arm A = full above) ---
  - {kind: train, arm: str_only,            seeds: [42, 43, 44, 45, 46], epochs: 20, strict: true, export: true,
     sec_per_step: 0.076619, arm_class: str, flags: ["--no-geo-stream", "--use-str-stream"]}
  - {kind: train, arm: both_streams,        seeds: [42, 43, 44, 45, 46], epochs: 20, strict: true, export: true,
     sec_per_step: 0.076619, arm_class: str, flags: ["--use-str-stream"]}
  - {kind: train, arm: str_topology_only,   seeds: [42, 43, 44, 45, 46], epochs: 20, strict: true, export: true,
     sec_per_step: 0.076619, arm_class: str, flags: ["--no-geo-stream", "--use-str-stream", "--str-topology-only"]}
  - {kind: train, arm: true_contact_edges,  seeds: [42, 43, 44, 45, 46], epochs: 20, strict: true, export: true,
     sec_per_step: 0.067824, arm_class: v2, flags: ["--true-contact-edges", "--true-contacts-dir", "data/true_contacts"]}

  - {id: aggregate, kind: aggregate, phase: post}
