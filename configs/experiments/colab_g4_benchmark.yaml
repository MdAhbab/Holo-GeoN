# Headline benchmark on one Colab G4 (RTX PRO 6000 Blackwell, 96 GB), 100 compute units.
#
#   python -m scripts.remote_job --manifest configs/experiments/colab_g4_benchmark.yaml --plan
#
# Everything that goes in the paper's comparison table runs on THIS GPU type
# (kaggle-colab-lessons.md: same GPU for every compared model and seed).
#
# sec_per_step is an ASSUMPTION until the first train item finishes. The local
# RTX 5070 Ti measured a 33.8 ms GPU step (configs/run.yaml); 40 ms leaves room for
# a slower Colab CPU feeding 4 loader workers. `--plan` re-projects from the
# measured steady state after one run, and the cut order below is applied if the
# projection is over budget. Do not launch the second wave before re-planning.

name: colab_g4_benchmark
platform: colab_g4
config: configs/benchmark.yaml
cache: /content/holo/cache/esm2_650M
out_root: /content/holo/runs/colab_g4_benchmark
num_workers: 4

cost:
  gpu: G4
  cu_per_hour: 8.9        # measured in earlier sessions (lessons file)
  budget_cu: 100
  reserve_cu: 10          # watchdog floor: stop below this, never spend it

sizing:
  steps_per_epoch: 4782   # ceil(305,995 train rows / 64); stability-only epoch
  epochs: 12
  sec_per_step: 0.040     # ASSUMED, replace with the measured value
  eval_overhead: 0.10     # per-epoch validation + test pass
  strict_factor: 1.3
  vm_overhead_h: 0.30     # VM start, pip installs, Drive mount, idle
  precompute_h: 0.15      # 176 + 412 proteins through ESM-2 650M
  external_h: 0.03
  baselines_h: 0.40

# Applied in this order when the measured projection is over the usable budget.
cut_order:
  - "competitor_retrain_*"
  - "*_s46"
  - "*_s45"
  - baselines

items:
  - {id: precompute, kind: precompute}

  # The headline model. 5 seeds gives a usable spread against the 0.030 test-Pearson
  # run-to-run noise measured in review round 1.
  - {kind: train, arm: full, seeds: [42, 43, 44, 45, 46], epochs: 12}

  # Controls on the identical split: substitution frequency, esm_mlp, the
  # parameter-matched MLP, and ESM-2 zero-shot on a capped number of rows.
  - {id: baselines, kind: baselines, phase: post, flags: ["--zero-shot-limit", "2000"], est_hours: 0.40}

  # Structures for the FireProtDB external set, needed only by the structure-input
  # competitors. Prefer running scripts/fetch_alphafold.py locally and copying the
  # folder to Drive: it is 176 small HTTP downloads and buys nothing on a paid VM.
  # Enable this item only if the VM is the only machine with network access.
  # - {id: fetch_alphafold, kind: cmd, est_hours: 0.25,
  #    argv: ["{py}", "-m", "scripts.fetch_alphafold", "--out", "data/alphafold_fireprot"]}

  # Competitors (BENCHMARK_PLAN.md section 2). NOT ENABLED: the adapters do not exist
  # yet and their head-training time is unmeasured, so est_hours below are placeholders
  # to be replaced after one timed run. Each adapter is a `kind: cmd` item that trains
  # on OUR train rows and writes <out>/pred_test.parquet (and pred_external.parquet)
  # with columns row_id, y_pred; scripts/score_predictions.py does the scoring.
  # - {id: competitor_retrain_thermompnn, kind: cmd, phase: post, est_hours: 1.0,
  #    argv: ["{py}", "-m", "scripts.competitors.thermompnn", "--out", "{out}"]}
  # - {id: competitor_retrain_spurs,      kind: cmd, phase: post, est_hours: 1.5,
  #    argv: ["{py}", "-m", "scripts.competitors.spurs", "--out", "{out}"]}
  # - {id: competitor_retrain_prostata,   kind: cmd, phase: post, est_hours: 1.0,
  #    argv: ["{py}", "-m", "scripts.competitors.prostata", "--out", "{out}"]}
  # - {id: competitor_retrain_rasp,       kind: cmd, phase: post, est_hours: 0.8,
  #    argv: ["{py}", "-m", "scripts.competitors.rasp", "--out", "{out}"]}
  # StabilityArc is optional (workshop preprint, ranking score not kcal/mol, so
  # Spearman only). Add it last, and only if the budget survives the four above.
  # - {id: competitor_retrain_stabilityarc, kind: cmd, phase: post, est_hours: 0.8,
  #    argv: ["{py}", "-m", "scripts.competitors.stabilityarc", "--out", "{out}"]}

  - {id: aggregate, kind: aggregate, phase: post}
