# configs/run.yaml — pipeline configuration.
#
#   python run.py all --config configs/run.yaml
#
# Any value here can be overridden on the command line; the CLI always wins.
# Column-name overrides and graph hyperparameters live in configs/data.yaml,
# which is merged into the same namespace (both files are read — see
# src/config.py).

# --- encoder ---------------------------------------------------------------
# Frozen throughout. 650M is the shipped default; 150M (facebook/esm2_t30_150M_UR50D,
# 640-d) roughly halves the cache and the precompute pass if disk is tight.
esm_model: facebook/esm2_t33_650M_UR50D
# The encoder cache is read RANDOMLY - one record per training ROW, ~155k rows
# per epoch for ClinVar spread over 15k files - so where it lives dominates
# training throughput. On this machine the repo sits on a SATA HDD (Toshiba
# HDWT720) and a ClinVar batch took 1.8-2.3 s against a stability batch's 31 ms,
# leaving the GPU idle at 0-5%. Moved to the NVMe SSD it is random-access
# friendly. Rebuild it anywhere with:
#     python run.py precompute --cache <path>
cache: C:/Users/User/AppData/Local/holo-geon/cache/esm2_650M
device: cuda

# Mutation-centered window length, in residues. The window is always placed
# around the mutated residue, never at the sequence head.
window: 256

# Contacts cached per residue, and the minimum sequence separation for a pair to
# count as a contact rather than backbone context.
contact_top_k: 24
contact_min_sep: 3

# --- data ------------------------------------------------------------------
out_root: runs
stability_data: data/megascale_ddg_pairs.parquet
clinvar_data: data/clinvar_protein_pairs.parquet

# Independent stability test set: FireProtDB with every MegaScale-sourced row
# removed, so it shares no measurement with stability_data. Scored by
# `python run.py external`, never trained on. Built by
# `python -m scripts.build_fireprot_table`. Set to null to skip.
external_data: data/fireprotdb_holdout.parquet

# Optional tables. A head whose table is absent stays untrained, is recorded as
# untrained in the run manifest, and must not be described as a capability.
idr_data: null           # experimental radius of gyration (PED / SAXS)
mfi_data: null           # deep-mutational-scan fluorescence
proteomics_data: null    # retention time / expression

max_protein_length: 5000

# --- splits ----------------------------------------------------------------
# MMseqs2 clustering at this identity, unioned with gene identity where a gene
# column exists. Applies to every task.
split_method: mmseqs
identity: 0.30
coverage: 0.80
cv_folds: 5

# Seeding. Round-1 review found nothing in the training path was seeded, so two
# runs of the same command differed by 0.030 test Pearson - larger than most
# ablation effects. Everything stochastic now derives from this.
seed: 42
strict_determinism: false   # deterministic kernels: slower, bit-reproducible

# --- graph -----------------------------------------------------------------
graph_top_k: 16
geo_threshold: 0.30
eps: 0.10
delta: 0.10
mech_max_degree: 8
neighborhood_hops: 2

# --- model -----------------------------------------------------------------
hidden: 256
out_dim: 256
gat_heads: 4
aa_dim: 32
dropout: 0.1
use_ssm: true
# Ablation axes. The shipped model has all three on; scripts/ablations.py flips
# one at a time so a component's contribution is measured against an otherwise
# identical model.
use_mech_stream: true
use_geo_stream: true
site_anchored_readout: true

# --- training --------------------------------------------------------------
# Epochs is an upper bound: training stops early when the primary validation
# metric stops improving. v1 ran a fixed 8 epochs and its best epoch was 8,
# meaning it was still improving when it stopped.
#
# Round-2 review, R2-10: an "epoch" now means ONE EXPECTED PASS OVER THE PRIMARY
# TASK. It used to mean max(len(loader)) steps, which - once tasks were sampled
# proportionally - gave the primary task only ~63% of its own batches per epoch,
# so `epochs: 60` bought 37.7 passes over the ddG data and `early_stop_patience`
# counted units whose size depended on the OTHER tasks' row counts.
#
# BUDGET NOTE: at MegaScale/ClinVar scale this makes an epoch ~1.6x longer in
# steps than it was, so 60 epochs is ~1.6x the compute the old number implied.
# That is the correct 60 passes rather than 37.7, but if the wall-clock budget
# is fixed, lower this to ~38 to match what the previous configuration actually
# did. scripts/train.py prints steps_per_epoch and how it was derived.
# A1 (OVERFITTING_FIX.md section 3). Was 33. Validation Pearson saturates at
# epoch ~6 (0.7532); the selected epoch 15 scored 0.7616, a +0.0084 gain over
# nine further epochs and well inside the +/-0.035 cluster CI - i.e. noise. Those
# epochs took the train/val RMSE ratio from 1.56 to 2.05 and the sigma/error
# ratio from 1.91x to 2.49x, so they bought memorisation and nothing else.
#
# It also fixes the schedule. total_steps = steps_per_epoch * epochs, so with
# epochs: 33 and early stopping the cosine never reached its tail: the shipped
# checkpoint was taken at 62% of peak LR. At 12 the anneal completes inside the
# budget actually run.
epochs: 12
batch_size: 64
lr: 0.0003
# Raised from 1e-4 after an adversarial review measured what 1e-4 actually did:
# AdamW's decoupled decay is p -= lr*wd*p, so at lr 3e-4 that is a 3e-8 relative
# shrink per step and 0.81% across the WHOLE 270k-step run - decorative, not
# regularisation. Meanwhile the model has 20.6M parameters and sees only 322
# distinct training proteins (17,071 distinct site contexts), and its predicted
# sigma drifted from 1.30x to 2.39x below its own held-out RMSE: memorisation.
# Only weight MATRICES are decayed; norms, biases and the Kendall & Gal
# log-variance parameters are excluded in scripts/train.py, which is what makes
# a value this size safe to use.
weight_decay: 0.01
warmup_frac: 0.05
early_stop_patience: 4
grad_clip: 1.0
amp: true
# Measured on this machine with the cache on the SSD: pathogenicity batches run
# 7.0/s at 4 workers and 13.9/s at 8, stability 38/s and 84/s, against a 33.8 ms
# GPU step. 8 would keep the GPU better fed, but each worker holds a copy of the
# dataset and 8 exhausted 33.9 GB of RAM (MemoryError while spawning the
# evaluation workers). 4 leaves comfortable headroom for an unattended
# multi-hour run; raise it only while watching RSS.
num_workers: 4
max_rows: null

# Multi-task sampling: tasks are drawn in proportion to len(loader) ** this.
# 1.0 is strictly proportional, 0.0 gives every task the same number of steps
# (which replayed a 300-row table ~844x per epoch against a 270k-row one).
task_sampling_temperature: 0.5

# Whole-sequence tasks span the entire protein rather than a window; this caps
# pathological inputs, and the cap is reported when it bites.
max_sequence_nodes: 2048

# Whole-sequence batches are capped by padded NODE count rather than by sample
# count. Round-2 review, R2-02: at one shared batch_size a 2048-node protein
# graph costs 8x the 256-node ddG batch the memory budget is computed for, which
# put the analytic lower bound past the 16 GB target card and made three of the
# six heads untrainable at the shipped configuration. null means "spend the same
# node budget as the windowed loaders", i.e. batch_size * window = 16384, so a
# whole-sequence step and a ddG step cost the same by construction. Verify on
# the target GPU with:
#     python -m scripts.budget --device cuda --sequence-nodes 2048
sequence_node_budget: null

# Three-state neutral band, in kcal/mol, for stability rows that report no
# per-measurement error. A mutation is labelled "neutral" when |ddG| <= sigma.
# Round-2 review, R2-11: this was a module constant while src/heads.py claimed
# the band "is not a hardcoded constant". The `sigma:` column override is
# commented out for every shipped dataset, so in practice this value decides the
# class of roughly a fifth of a realistic ddG distribution - and the three-state
# macro-F1 is the only reported evidence the swap-equivariant head buys
# anything. metrics.json records it with a sensitivity table.
three_state_sigma: 0.5

# Encoder records held in memory per DataLoader worker; 0 disables the cache.
# MutationDataset reads one record per ROW while the cache is keyed by PARENT, so
# on MegaScale the same .pt is deserialised ~100x per epoch per protein. Each
# record is about L * esm_dim * 2 bytes (~1.5 MB at L=600, dim=1280), so 32
# records costs roughly 50 MB per worker - times num_workers. Off by default:
# round-1's commit message claimed a graph cache that did not exist (R1-17), and
# the replacement should be enabled deliberately with the RAM cost in view.
record_cache_size: 512

# Measured on this machine's tables: the 412 MegaScale parents are 0.15 MB each
# (0.06 GB for ALL of them) and each recurs ~740x per epoch, so they stay
# resident and are served from RAM; ClinVar's 15,177 parents are 1.95 MB each
# (29.6 GB, uncacheable) and recur ~10x, so they cycle through the remaining
# slots. Steady-state cost is therefore ~130-200 MB per worker, not the
# 512 * 1.95 MB the capacity alone would suggest. Without this the GPU sat at
# 0% between bursts, waiting on one deserialisation per ROW.

# B1 (OVERFITTING_FIX.md section 3). Gaussian noise added to the cached ESM
# embeddings, TRAINING SPLIT ONLY (src/data.MutationDataset).
#
# The encoder is frozen and its output cached, so every epoch shows the model a
# byte-identical input for row i. The site-anchored readout then makes
# (parent, site) a stable key - 17,071 distinct values over 305,995 training
# rows - and a 20.6M-parameter network stores a response per key. Measured: train
# Pearson 0.954 vs test 0.758, and the fitted sigma is honest on train (1.12x)
# while 2.5x overconfident on test.
#
# Raising weight_decay 100x (1e-4 -> 1e-2) changed none of it, because weight
# decay constrains the map and not the keys. This is the one cheap change that
# removes the precondition: with noise, row i is a different input every epoch,
# so there is no fixed table to memorise.
#
# Scale: per-dimension std ACROSS RESIDUES in the cache is ~0.17-0.20, so 0.10 is
# roughly half the real variation - substantial without destroying the signal.
# Antisymmetry is unaffected: the draw happens once per sample before the
# backbone, so z is shared by both s() calls and ddG = s(z,e_mt) - s(z,e_wt)
# stays exact.
# MEASURED (runs/noise_sigma0.10): at sigma=0.10 the train/val gap was WORSE at
# every matched epoch than without noise (ep2 1.201 vs 1.187, ep5 1.597 vs
# 1.498) and val Pearson was ~0.02 lower. The gap reduction that run showed
# came entirely from early stopping (A1 above), not from the noise. Off.
embed_noise_std: 0.0

# --- ablations -------------------------------------------------------------
# The ONE metric per task the ablation grid compares, declared before any run.
# Round-2 review, R2-06: the grid used to compare every numeric key in the test
# metrics - 80 uncorrected comparisons across 5 arms, including `target_std` and
# `pos_rate`, which are properties of the split and identical across arms. Under
# the global null the chance of at least one spurious "component matters" flag
# was 0.999. Deltas are now paired across seeds and Holm-corrected over exactly
# this family.
ablation_metrics:
  stability: pearson
  pathogenicity: auroc
  idr: pearson
  mfi: pearson
  proteomics: pearson
