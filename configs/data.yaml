# configs/data.yaml — per-dataset column overrides.
#
# This file IS read. In v1 it was not: the guide told users to set column names
# here when auto-detection failed, but no script imported it, so edits had no
# effect and the real fix was to rewrite the parquet. Everything now loads
# through src/config.py, which merges this file into the run configuration.
#
# Each top-level key is a dataset filename without its extension, so
# `data/megascale_ddg_pairs.parquet` is configured under `megascale_ddg_pairs`.
# Only set what auto-detection gets wrong — run
# `python -m scripts.inspect_data --data <file>` first and look for `-> None`.
#
# Canonical names, and what they mean:
#   wt_seq  wild-type / reference PROTEIN sequence   (this is the parent that gets encoded)
#   mt_seq  mutant / alternate PROTEIN sequence      (used only to locate the substitution)
#   target  numeric ddG label                        (stability)
#   ddg_sign  which sign convention the target uses:
#             stabilizing_positive (default) | destabilizing_positive
#             Holo-GeoN's internal convention is ddG = dG_mut - dG_wt, so
#             POSITIVE means STABILISING. Correlation metrics are invariant to a
#             global sign flip, so an inverted table produces an excellent r
#             while every qualitative claim - the three-state labels, the
#             interface verdict, the zero-shot direction - is backwards, with
#             nothing in any artifact revealing it. Set this per dataset; the
#             loader normalises to the internal convention, records the applied
#             sign in the leakage report, and warns if the mean ddG comes out
#             positive (random substitutions are destabilising on average).
#   sigma   per-measurement ddG uncertainty          (sets the three-state neutral band)
#   label   pathogenic / benign                      (pathogenicity)
#   gene    gene symbol                              (merged into split grouping)
#   cds     real coding NUCLEOTIDE sequence          (enables the mechanistic stream)
#   rg      experimental radius of gyration          (IDR)
#   value   MFI / retention time / expression
#
# wt_seq and mt_seq must be PROTEIN sequences. Pointing them at nucleotide
# columns will not error — A, C, G and T are all valid amino-acid letters, so a
# protein language model accepts them silently and learns nothing. That failure
# mode is exactly what produced a meaningless ClinVar task in the predecessor
# repository, so check `scripts.inspect_data` output rather than assuming.

megascale_ddg_pairs:
  # wt_seq: wildtype_sequence
  # mt_seq: mutant_sequence
  # target: ddG
  # ddg_sign: stabilizing_positive
  # sigma:  ddG_std
  # cds:    dna_seq          # real CDS -> CAI + ViennaRNA folding -> E_mech.
  #                          # Recover it with `python run.py etl --cds-source ...`
  #                          # if the processed table dropped it. There is no
  #                          # back-translation fallback: a proxy transcript is a
  #                          # deterministic function of the protein and carries
  #                          # no information the embeddings lack.

clinvar_protein_pairs:
  # wt_seq: ref_protein
  # mt_seq: alt_protein
  # label:  clinical_significance
  # gene:   gene_symbol

# ---------------------------------------------------------------------------
# Graph and feature hyperparameters. Merged flat into the run configuration.
# ---------------------------------------------------------------------------
graph:
  graph_top_k: 16         # neighbours per node in the built graph
  geo_threshold: 0.30     # contact-probability floor for an E_geo edge
  eps: 0.10               # |dCAI|  threshold for an E_mech edge
  delta: 0.10             # |dmRNA| threshold for an E_mech edge
  mech_max_degree: 8      # degree cap keeping E_mech sparse
  neighborhood_hops: 2    # k-hop site neighbourhood for the readout
